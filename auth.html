<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 / 注册 — 小韩的空间</title>
  <style>
    :root {
      --bg: #0f0f13;
      --surface: #1a1a24;
      --surface2: #22222f;
      --accent: #7c6af7;
      --accent2: #4ecdc4;
      --accent3: #f7c26a;
      --text: #e8e8f0;
      --text-muted: #8888aa;
      --radius: 16px;
      --shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    /* 背景粒子 */
    #canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.35;
    }

    /* 返回主页链接 */
    .back-link {
      position: fixed;
      top: 24px;
      left: 32px;
      z-index: 10;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.88rem;
      transition: color 0.25s;
    }
    .back-link:hover { color: var(--text); }
    .back-arrow {
      width: 18px;
      height: 18px;
      border-left: 2px solid currentColor;
      border-bottom: 2px solid currentColor;
      transform: rotate(45deg);
      display: inline-block;
      flex-shrink: 0;
    }

    /* 主容器 */
    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 40px 24px;
      width: 100%;
      max-width: 720px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      background: rgba(124, 106, 247, 0.12);
      border: 1px solid rgba(124, 106, 247, 0.3);
      border-radius: 999px;
      font-size: 0.82rem;
      color: var(--accent);
      margin-bottom: 28px;
      animation: fadeDown 0.7s ease both;
    }
    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent2);
      animation: pulse 2s infinite;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 800;
      letter-spacing: -1px;
      line-height: 1.2;
      animation: fadeDown 0.7s 0.08s ease both;
    }
    .gradient-text {
      background: linear-gradient(135deg, var(--accent), var(--accent2), var(--accent3));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle {
      margin-top: 14px;
      color: var(--text-muted);
      font-size: 1rem;
      animation: fadeDown 0.7s 0.16s ease both;
    }

    /* 三张选项卡片 */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      margin-top: 48px;
      animation: fadeDown 0.7s 0.24s ease both;
    }
    .card {
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: var(--radius);
      padding: 36px 24px;
      text-decoration: none;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      position: relative;
      overflow: hidden;
      transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
      cursor: pointer;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--c1, var(--accent)), var(--c2, var(--accent2)));
      opacity: 0;
      transition: opacity 0.3s;
    }
    .card:hover {
      transform: translateY(-7px);
      box-shadow: var(--shadow);
      border-color: rgba(124, 106, 247, 0.25);
    }
    .card:hover::before { opacity: 1; }
    .card-icon {
      width: 60px;
      height: 60px;
      border-radius: 16px;
      background: rgba(124, 106, 247, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
    }
    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    .card-desc {
      font-size: 0.83rem;
      color: var(--text-muted);
      line-height: 1.6;
    }
    .card-arrow {
      margin-top: 4px;
      font-size: 1rem;
      color: var(--text-muted);
      transition: transform 0.25s, color 0.25s;
    }
    .card:hover .card-arrow {
      transform: translateX(4px);
      color: var(--accent);
    }

    /* 动画 */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    @media (max-width: 520px) {
      .cards { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<canvas id="canvas"></canvas>

<a href="index.html" class="back-link">
  <span class="back-arrow"></span>
  返回主页
</a>

<div class="container">
  <div class="badge">
    <span class="badge-dot"></span>
    欢迎回来 👋
  </div>
  <h1>请选择<br><span class="gradient-text">登录方式</span></h1>
  <p class="subtitle">选择下方对应入口继续操作</p>

  <div class="cards">
    <!-- 用户注册 -->
    <a href="register.html" class="card" style="--c1:#7c6af7;--c2:#4ecdc4">
      <div class="card-icon">✍️</div>
      <div class="card-title">用户注册</div>
      <div class="card-desc">还没有账号？<br>立即免费注册</div>
      <div class="card-arrow">→</div>
    </a>

    <!-- 用户登录 -->
    <a href="login.html" class="card" style="--c1:#4ecdc4;--c2:#f7c26a">
      <div class="card-icon">🔐</div>
      <div class="card-title">用户登录</div>
      <div class="card-desc">已有账号？<br>直接登录进入</div>
      <div class="card-arrow">→</div>
    </a>

    <!-- 管理员登录 -->
    <a href="admin-login.html" class="card" style="--c1:#f7c26a;--c2:#f76a8c">
      <div class="card-icon">🛡️</div>
      <div class="card-title">管理员登录</div>
      <div class="card-desc">管理后台专属<br>入口</div>
      <div class="card-arrow">→</div>
    </a>
  </div>
</div>

<script>
  (function () {
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let W, H, dots = [];
    const COLORS = ['#7c6af7', '#4ecdc4', '#f7c26a', '#f76a8c'];
    function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
    function init() {
      dots = [];
      const n = Math.min(70, Math.floor((W * H) / 16000));
      for (let i = 0; i < n; i++) {
        dots.push({ x: Math.random()*W, y: Math.random()*H, r: Math.random()*2+0.5,
          vx: (Math.random()-0.5)*0.4, vy: (Math.random()-0.5)*0.4,
          color: COLORS[Math.floor(Math.random()*COLORS.length)], alpha: Math.random()*0.6+0.2 });
      }
    }
    function draw() {
      ctx.clearRect(0, 0, W, H);
      for (let i = 0; i < dots.length; i++) {
        for (let j = i+1; j < dots.length; j++) {
          const dx = dots[i].x-dots[j].x, dy = dots[i].y-dots[j].y;
          const dist = Math.sqrt(dx*dx+dy*dy);
          if (dist < 130) {
            ctx.beginPath(); ctx.moveTo(dots[i].x, dots[i].y); ctx.lineTo(dots[j].x, dots[j].y);
            ctx.strokeStyle = `rgba(124,106,247,${(1-dist/130)*0.18})`; ctx.lineWidth = 1; ctx.stroke();
          }
        }
      }
      dots.forEach(d => {
        ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI*2);
        ctx.fillStyle = d.color; ctx.globalAlpha = d.alpha; ctx.fill(); ctx.globalAlpha = 1;
        d.x += d.vx; d.y += d.vy;
        if (d.x < 0 || d.x > W) d.vx *= -1;
        if (d.y < 0 || d.y > H) d.vy *= -1;
      });
      requestAnimationFrame(draw);
    }
    window.addEventListener('resize', () => { resize(); init(); });
    resize(); init(); draw();
  })();
</script>
</body>
</html>
